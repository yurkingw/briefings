# GitHub Pages via Actions. This does not deploy from a branch.
#
# A PAT/App push of one public envelope under _inbox/ opens this workflow.
# The process job fast-forwards content/ with the automatic GITHUB_TOKEN.
# That push does not start another workflow, so this same run builds and deploys.
# cancel-in-progress false is not a FIFO queue. Deploy proceeds only when
# origin/main still equals the processed content SHA. The gap before
# deploy-pages returns is not proven empty.
# The upload PAT is not stored as an Actions secret.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
    - cron: '17 1 * * 1'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      content_sha: ${{ steps.plan.outputs.content_sha }}
      trigger_sha: ${{ steps.plan.outputs.trigger_sha }}
      ack: ${{ steps.plan.outputs.ack }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - id: plan
        run: node scripts/briefings-inbox-process.mjs

  deploy:
    needs: process
    if: needs.process.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.process.outputs.content_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a stale tip
        run: |
          git fetch origin main
          tip=$(git rev-parse origin/main)
          test "$tip" = "${{ needs.process.outputs.content_sha }}"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Write the dual-SHA manifest
        env:
          TRIGGER_SHA: ${{ needs.process.outputs.trigger_sha }}
          CONTENT_SHA: ${{ needs.process.outputs.content_sha }}
          MANIFEST: ${{ needs.process.outputs.manifest }}
        run: node scripts/briefings-deploy-manifest.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  ack:
    needs: [process, deploy]
    if: needs.deploy.result == 'success' && needs.process.outputs.ack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - env:
          MANIFEST: ${{ needs.process.outputs.manifest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/briefings-inbox-ack.mjs
