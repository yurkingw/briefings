# GitHub Pages via Actions. This does not deploy from a branch.
#
# A PAT/App push of one public envelope under _inbox/ opens this workflow.
# The process job fast-forwards content/ with the automatic GITHUB_TOKEN.
# That push does not start another workflow, so this same run builds and deploys.
# cancel-in-progress false is not a FIFO queue. Deploy proceeds only when
# origin/main still equals the processed content SHA. The gap before
# deploy-pages returns is not proven empty.
# The upload PAT is not stored as an Actions secret.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
    - cron: '17 1 * * 1'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      content_sha: ${{ steps.plan.outputs.content_sha }}
      trigger_sha: ${{ steps.plan.outputs.trigger_sha }}
      ack: ${{ steps.plan.outputs.ack }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - id: plan
        run: node scripts/briefings-inbox-process.mjs

  deploy:
    needs: process
    if: needs.process.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.process.outputs.content_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a stale tip
        run: |
          git fetch origin main
          tip=$(git rev-parse origin/main)
          test "$tip" = "${{ needs.process.outputs.content_sha }}"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Write the dual-SHA manifest
        env:
          TRIGGER_SHA: ${{ needs.process.outputs.trigger_sha }}
          CONTENT_SHA: ${{ needs.process.outputs.content_sha }}
          MANIFEST: ${{ needs.process.outputs.manifest }}
        run: node scripts/briefings-deploy-manifest.mjs
      # The tar is uploaded as github-pages. overwrite replaces one same-name
      # artifact. The deployment below uses the upload id, not a name list.
      - name: Archive the Pages site
        shell: sh
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "$INPUT_PATH" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .
        env:
          INPUT_PATH: _site
      - name: Upload the Pages artifact
        id: pages-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      # deploy-pages@d6db901 asked the job-scoped list for an id. That list
      # can still return an id overwrite already deleted. This step sends
      # only the id from the upload above.
      - id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        with:
          retries: "0"
          script: |
            const artifactId = String(process.env.ARTIFACT_ID || "")
            if (!/^\d{1,20}$/.test(artifactId)) {
              core.setFailed("artifact_id_invalid")
              return
            }
            core.info(`pages_artifact_id=${artifactId}`)
            const { pathToFileURL } = require("node:url")
            const { deployFromActions, pagesActionsRequest } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/briefings-pages-deploy.mjs`).href)
            try {
              const pageUrl = await deployFromActions({
                artifactId,
                buildVersion: process.env.GITHUB_SHA,
                repository: process.env.GITHUB_REPOSITORY,
                getIdToken: () => core.getIDToken(),
                emit: (line) => core.info(line),
                request: (method, route, body) => pagesActionsRequest(
                  (route, parameters) => github.request(route, parameters),
                  method,
                  route,
                  body,
                ),
              })
              core.setOutput("page_url", pageUrl)
            } catch (error) {
              core.setFailed(error && error.code ? String(error.code) : "deploy_failed")
            }

  ack:
    needs: [process, deploy]
    if: needs.deploy.result == 'success' && needs.process.outputs.ack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - env:
          MANIFEST: ${{ needs.process.outputs.manifest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/briefings-inbox-ack.mjs
