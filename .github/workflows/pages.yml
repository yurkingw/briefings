# GitHub Pages via Actions. This does not deploy from a branch.
#
# A PAT/App push of one public envelope under _inbox/ opens this workflow.
# The process job fast-forwards content/ with the automatic GITHUB_TOKEN.
# That push does not start another workflow, so this same run builds and deploys.
# cancel-in-progress false is not a FIFO queue. Deploy proceeds only when
# origin/main still equals the processed content SHA. The gap before
# deploy-pages returns is not proven empty.
# The upload PAT is not stored as an Actions secret.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
    - cron: '17 1 * * 1'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      content_sha: ${{ steps.plan.outputs.content_sha }}
      trigger_sha: ${{ steps.plan.outputs.trigger_sha }}
      ack: ${{ steps.plan.outputs.ack }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - id: plan
        run: node scripts/briefings-inbox-process.mjs

  deploy:
    needs: process
    if: needs.process.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.process.outputs.content_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a stale tip
        run: |
          git fetch origin main
          tip=$(git rev-parse origin/main)
          test "$tip" = "${{ needs.process.outputs.content_sha }}"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Write the dual-SHA manifest
        env:
          TRIGGER_SHA: ${{ needs.process.outputs.trigger_sha }}
          CONTENT_SHA: ${{ needs.process.outputs.content_sha }}
          MANIFEST: ${{ needs.process.outputs.manifest }}
        run: node scripts/briefings-deploy-manifest.mjs
      # upload-pages-artifact@7b1f4a7 packs this tar and uploads it as github-pages
      # without overwrite. Re-running the job keeps the earlier artifact, and
      # deploy-pages@d6db901 fails unless this run has exactly one of that name.
      - name: Archive the Pages site
        shell: sh
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "$INPUT_PATH" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .
        env:
          INPUT_PATH: _site
      - name: Upload the Pages artifact
        id: pages-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      # One supported listArtifacts() call before deploy. This step cannot
      # decide the deploy result. The install is the locked 2.1.3 package,
      # not the deploy-pages ncc bundle. That package may retry internally.
      - name: Observe the artifact list deploy-pages uses
        continue-on-error: true
        env:
          UPLOADED_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.pages-artifact.outputs.artifact-digest }}
        run: sh scripts/briefings-pages-artifact-observe.sh
      # deploy-pages@d6db901 asks the job-scoped list for an id. On the noon
      # rerun that list still returned the id overwrite had deleted. Pages
      # deploys the id this upload step just finalized.
      - id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        with:
          retries: "0"
          script: |
            const { pathToFileURL } = require("node:url")
            const { deployFromActions } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/briefings-pages-deploy.mjs`).href)
            const pageUrl = await deployFromActions({
              artifactId: process.env.ARTIFACT_ID,
              buildVersion: process.env.GITHUB_SHA,
              repository: process.env.GITHUB_REPOSITORY,
              getIdToken: () => core.getIDToken(),
              request: async (method, route, body) => {
                try {
                  const response = await github.request(`${method} ${route}`, body || {})
                  return { status: response.status, body: response.data }
                } catch (error) {
                  if (typeof error.status === "number") return { status: error.status, body: error.response && error.response.data }
                  throw error
                }
              },
            })
            core.setOutput("page_url", pageUrl)

  ack:
    needs: [process, deploy]
    if: needs.deploy.result == 'success' && needs.process.outputs.ack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - env:
          MANIFEST: ${{ needs.process.outputs.manifest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/briefings-inbox-ack.mjs
